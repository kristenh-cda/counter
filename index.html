<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Counting App</title>
    
    <!-- iOS Home Screen App Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Counters">
    <!-- App Icon: Black background, blue counter set to 8 (5/6ths full) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><circle cx='50' cy='50' r='35' fill='none' stroke='%2338bdf8' stroke-width='10'/><path d='M 15 50 A 35 35 0 1 0 85 50 L 85 85 L 15 85 Z' fill='%2338bdf8' opacity='0.85'/><text x='50' y='63' font-family='sans-serif' font-weight='900' font-size='38' fill='white' text-anchor='middle'>8</text></svg>">
    <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='black'/><circle cx='50' cy='50' r='35' fill='none' stroke='%2338bdf8' stroke-width='10'/><path d='M 15 50 A 35 35 0 1 0 85 50 L 85 85 L 15 85 Z' fill='%2338bdf8' opacity='0.85'/><text x='50' y='63' font-family='sans-serif' font-weight='900' font-size='38' fill='white' text-anchor='middle'>8</text></svg>">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Rounded Font for Numbers -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Disable text selection and highlighting for a native app feel */
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* The Custom Liquid Ring */
        .liquid-container {
            width: 85vw;
            max-width: 360px;
            height: 85vw;
            max-height: 360px;
            border-radius: 50%;
            border: 48px solid var(--ring-color);
            background-color: white; /* Ensures text is always readable */
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4), inset 0 10px 25px rgba(0,0,0,0.15);
        }
        
        /* Gentle White Glow Overlay */
        .liquid-container::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: inset 0 0 60px rgba(255, 255, 255, 0.9);
            z-index: 5;
            pointer-events: none;
        }

        /* Dashboard Circular Shortcuts */
        .dash-circle {
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15), inset 0 0 15px rgba(255,255,255,0.8);
        }
        
        /* Gentle White Glow Overlay */
        .liquid-container::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: inset 0 0 60px rgba(255, 255, 255, 0.9);
            z-index: 5;
            pointer-events: none;
        }
        
        @media (min-width: 640px) {
            .liquid-container {
                width: 500px;
                max-width: 75vh;
                height: 500px;
                max-height: 75vh;
            }
        }

        .liquid-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: var(--ring-color);
            opacity: 0.85; /* Slight transparency so it looks like liquid */
            transition: height 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
            /* Soft liquid shading and glossy top edge (meniscus) */
            box-shadow: inset 0 15px 25px rgba(255, 255, 255, 0.4);
            border-top: 3px solid rgba(255, 255, 255, 0.5);
        }

        .liquid-text {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', sans-serif;
            font-size: 6.5rem;
            font-weight: 700;
            color: black;
            z-index: 10; /* Keeps text above the liquid */
            transition: font-size 0.2s ease-in-out;
        }
        
        .liquid-text.shrink {
            font-size: 4.5rem;
        }
        
        @media (min-width: 640px) {
            .liquid-text {
                font-size: 10rem;
            }
            .liquid-text.shrink {
                font-size: 7.5rem;
            }
        }
        
        .pulse-anim {
            animation: pulse-ring 0.15s ease-out;
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(1); }
            50% { transform: scale(0.97); }
            100% { transform: scale(1); }
        }
        
        @keyframes bg-move {
            0% { background-position: 0px 0px; }
            100% { background-position: 240px 240px; } /* Exactly two 120px cycles to perfectly loop back to the start */
        }
        
        @keyframes bg-flash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.15) contrast(1.1); }
        }
        
        .celebration-active {
            /* Runs for exactly 3 seconds and stops smoothly on the exact frame it started on */
            animation: bg-move 3s linear forwards, bg-flash 0.6s ease-in-out 5 forwards !important;
        }
    </style>
</head>
<body class="transition-colors duration-300 min-h-screen w-full">

    <!-- Main App Container -->
    <div id="app" class="w-full h-full min-h-screen"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        // Firebase Config
        const myFirebaseConfig = {
            apiKey: "AIzaSyAJvGT0O1DWBm_XjLtOuZC3TWiv6WKKVG4",
            authDomain: "speechcounter-cda.firebaseapp.com",
            projectId: "speechcounter-cda",
            storageBucket: "speechcounter-cda.firebasestorage.app",
            messagingSenderId: "987346473519",
            appId: "1:987346473519:web:04ea86e93d659ca4a86cda",
            measurementId: "G-4P6Z6VXVJF"
        };

        const firebaseConfig = myFirebaseConfig || (typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null);
        let db;

        if (firebaseConfig) {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
        }

        // Saturated Pastel Ring Colors
        const ringColors = [
            '#E64836', '#FF4A3D','#FDA649', '#FCCE36', '#FDE55E', // Reds/Oranges/Yellows
            '#CBF778', '#4FDD45', '#4FA740', '#40DD9F', '#37E6C9', // Greens/Teals
            '#4FE4F8', '#60CAFB', '#61A8FA', '#889BFB', '#B29CFC', // Blues/Purples
            '#CC9BFD', '#F78DC7', '#FB8896', '#B3C2D1', '#A9A9A9'  // Pinks/Grey
        ];

        const appThemes = [
            { id: 'white', name: 'White', color: '#ffffff', icon: '' },
            { id: 'pink_daisy', name: 'Pink Daisy', color: '#fce7f3', icon: '🌼' },
            { id: 'yellow_sun', name: 'Yellow Sun', color: '#fef08a', icon: '☀️' },
            { id: 'green_tree', name: 'Green Tree', color: '#dcfce7', icon: '🌳' },
            { id: 'turquoise_duck', name: 'Turquoise Duck', color: '#ccfbf1', icon: '🦆' },
            { id: 'blue_fish', name: 'Blue Fish', color: '#dbeafe', icon: '🐟' },
            { id: 'purple_butterfly', name: 'Purple Butterfly', color: '#f3e8ff', icon: '🦋' },
            { id: 'green_dino', name: 'Green Dino', color: '#bbf7d0', icon: '🦕' },
            { id: 'red_racecar', name: 'Red Racecar', color: '#fee2e2', icon: '🏎️' },
            { id: 'brown_poop', name: 'Brown Poop', color: '#ffedd5', icon: '💩' },
            { id: 'rainbow_lollipop', name: 'Rainbow Lollipop', color: '#fdf4ff', icon: '🍭' },
            { id: 'blue_snowflake', name: 'Blue Snowflake', color: '#e0f2fe', icon: '❄️' },
            { id: 'blue_snowman', name: 'Blue Snowman', color: '#bae6fd', icon: '⛄' },
            { id: 'orange_jack', name: 'Orange Jack', color: '#ffedd5', icon: '🎃' },
            { id: 'grey_ghost', name: 'Grey Ghost', color: '#f1f5f9', icon: '👻' },
            { id: 'green_tree2', name: 'Christmas Tree', color: '#ecfdf5', icon: '🎄' },
            { id: 'red_santa', name: 'Red Santa', color: '#fecaca', icon: '🎅' }
        ];

        // Custom Pixabay Audio Objects
        const popAudio = new Audio("https://cdn.pixabay.com/download/audio/2026/03/15/audio_82c2b79a54.mp3?filename=pop-423717.mp3");
        const fanfareAudio = new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_c89c836965.mp3?filename=fanfare-46385.mp3");

        // Preload sounds
        popAudio.load();
        fanfareAudio.load();

        // State variables
        let counters = [];
        let currentView = 'dashboard'; 
        let tempColor = '';
        let tempBgColor = '';
        let tempShowImage = true;
        let audioCtx = null;
        let touchStartY = 0;
        let isSwiping = false;
        let isCelebrating = false;
        let isDraining = false;
        let openSettingsImmediately = false;
        let sortOption = 'recent'; 
        let sortAscending = false;
        let syncCode = localStorage.getItem('countingApp_syncCode') || '';
        let unsubscribeCounters = null;

        counters = JSON.parse(localStorage.getItem('countingApp_data')) || [];
        
        if (db) {
            setupRealtimeSubscription();
        }

        function setupRealtimeSubscription() {
            if (!db) return;
            if (unsubscribeCounters) unsubscribeCounters();
            
            const activeId = syncCode.trim() || 'default_local_user';
            const countersRef = collection(db, 'artifacts', appId, 'users', activeId, 'counters');
            
            unsubscribeCounters = onSnapshot(query(countersRef), (snapshot) => {
                counters = [];
                snapshot.forEach((doc) => {
                    counters.push({ id: doc.id, ...doc.data() });
                });
                renderApp();
            }, (error) => {
                console.error("Firebase sync error:", error);
            });
        }

        function saveData() {
            localStorage.setItem('countingApp_data', JSON.stringify(counters));
            if (db) {
                const activeId = syncCode.trim() || 'default_local_user';
                counters.forEach(c => {
                    const cRef = doc(db, 'artifacts', appId, 'users', activeId, 'counters', c.id);
                    setDoc(cRef, c).catch(e => console.error("Save error:", e));
                });
            }
        }

        function createCounterObject() {
            return {
                id: Math.random().toString(36).substr(2, 9),
                name: 'My Counter',
                count: 0,
                goal: 100,
                step: 1,
                color: '#ff7675',
                themeId: 'white',
                showImage: true,
                lastAccessed: Date.now()
            };
        }

        window.createNewCounter = function() {
            const newC = createCounterObject();
            counters.push(newC);
            saveData();
            
            currentView = newC.id;
            openSettingsImmediately = true;
            renderApp();
        }

        // Audio Triggers with robust Web Audio Synth Fallback
        function playPopSound(isDecrease = false) {
            popAudio.currentTime = 0;
            popAudio.play().catch(() => {
                // Fallback synth pop sound
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(isDecrease ? 120 : 250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(isDecrease ? 30 : 60, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            });
        }

        function playCelebrateSound() {
            fanfareAudio.currentTime = 0;
            fanfareAudio.play().catch(() => {
                // Fallback synth fanfare chord
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const notes = [261.63, 329.63, 392.00, 523.25]; 
                notes.forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    const startTime = audioCtx.currentTime + (i * 0.1);
                    gain.gain.setValueAtTime(0, startTime);
                    gain.gain.linearRampToValueAtTime(0.3, startTime + 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 2.8);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 3.0);
                });
            });
        }

        function isDark(hex) {
            if (hex === '#000000') return true;
            if (!hex || !hex.startsWith('#')) return false;
            const r = parseInt(hex.slice(1,3), 16) || 0;
            const g = parseInt(hex.slice(3,5), 16) || 0;
            const b = parseInt(hex.slice(5,7), 16) || 0;
            const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
            return luma < 128;
        }

        function getThemeObj(themeId) {
            return appThemes.find(t => t.id === themeId) || appThemes[0];
        }

        function applyThemeBackground(element, themeId, showImage = true) {
            const theme = getThemeObj(themeId);
            element.style.backgroundColor = theme.color;
            if (theme.icon && showImage) {
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" opacity="0.15"><text x="50%" y="50%" font-size="60" text-anchor="middle" dominant-baseline="central">${theme.icon}</text></svg>`;
                element.style.backgroundImage = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`;
                element.style.backgroundSize = '120px 120px';
            } else {
                element.style.backgroundImage = 'none';
            }
        }

        function renderApp() {
            if (currentView === 'dashboard') {
                renderDashboard();
            } else {
                renderFullScreenCounter();
            }
        }

        function renderDashboard() {
            document.body.style.backgroundColor = '#ffffff';
            document.body.style.backgroundImage = 'none';
            
            let sortedCounters = [...counters].sort((a, b) => {
                let valA, valB;
                if (sortOption === 'name') {
                    valA = (a.name || '').toLowerCase();
                    valB = (b.name || '').toLowerCase();
                    if (valA < valB) return sortAscending ? -1 : 1;
                    if (valA > valB) return sortAscending ? 1 : -1;
                    return 0;
                } else if (sortOption === 'count') {
                    valA = a.count || 0;
                    valB = b.count || 0;
                } else {
                    valA = a.lastAccessed || 0;
                    valB = b.lastAccessed || 0;
                }
                return sortAscending ? valA - valB : valB - valA;
            });

            let html = `
                <div class="p-6 sm:p-10 max-w-4xl mx-auto pb-24">
                    <div class="flex justify-end items-center mb-8 gap-4">
                        <div class="flex items-center gap-2">
                            <select id="sortOption" onchange="changeSort(event)" class="bg-gray-50 border border-gray-200 text-gray-700 py-2.5 px-4 rounded-xl font-bold shadow-sm focus:outline-none focus:ring-4 focus:ring-blue-100 cursor-pointer">
                                <option value="recent" ${sortOption === 'recent' ? 'selected' : ''}>Recently Used</option>
                                <option value="count" ${sortOption === 'count' ? 'selected' : ''}>Current Count</option>
                                <option value="name" ${sortOption === 'name' ? 'selected' : ''}>Alphabetical</option>
                            </select>
                            <button onclick="toggleSortDirection()" class="bg-gray-50 border border-gray-200 text-gray-700 p-2.5 rounded-xl shadow-sm hover:bg-gray-100 active:scale-95 transition-transform" title="Toggle Ascending/Descending">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="${sortAscending ? 'M5 15l7-7 7 7' : 'M19 9l-7 7-7-7'}"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-y-10 gap-x-4 sm:gap-x-6">
            `;
            
            sortedCounters.forEach(c => {
                const theme = getThemeObj(c.themeId || 'white');
                const showImage = c.showImage !== false;
                
                html += `
                    <div class="flex flex-col items-center gap-3">
                        <div onclick="openCounter('${c.id}')" 
                             class="w-full aspect-square rounded-full dash-circle flex items-center justify-center cursor-pointer transform hover:scale-105 active:scale-95 transition-all relative overflow-hidden"
                             style="background-color: ${c.color}40; border: 12px solid ${c.color}">
                            ${showImage && theme.icon ? `<div class="absolute inset-0 opacity-20 flex items-center justify-center text-6xl pointer-events-none">${theme.icon}</div>` : ''}
                            <span class="text-3xl sm:text-4xl font-black relative z-10" style="color: ${c.color}">${c.count}</span>
                        </div>
                        <span class="text-sm font-bold text-gray-800 text-center truncate w-full px-2">${c.name || 'Counter'}</span>
                    </div>
                `;
            });

            html += `
                    <div class="flex flex-col items-center gap-3">
                        <div onclick="createNewCounter()" 
                             class="w-full aspect-square rounded-full flex items-center justify-center cursor-pointer hover:bg-gray-100 active:scale-95 transition-all bg-white shadow-lg text-gray-400 hover:text-gray-600 border-2 border-gray-100">
                            <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M12 4v16m8-8H4"></path></svg>
                        </div>
                        <span class="text-sm font-bold text-gray-400 text-center truncate w-full px-2">Add New</span>
                    </div>
                </div>
            </div>
            `;
            
            document.getElementById('app').innerHTML = html;
        }

        window.changeSort = function(e) {
            sortOption = e.target.value;
            if (sortOption === 'recent') sortAscending = false; 
            else if (sortOption === 'count') sortAscending = false; 
            else sortAscending = true; 
            renderApp();
        }

        window.toggleSortDirection = function() {
            sortAscending = !sortAscending;
            renderApp();
        }

        window.openCounter = function(id) {
            currentView = id;
            openSettingsImmediately = false;
            
            const c = counters.find(x => x.id === id);
            if (c) {
                c.lastAccessed = Date.now();
                saveData();
            }
            
            renderApp();
        }

        function renderFullScreenCounter() {
            const c = counters.find(x => x.id === currentView);
            if (!c) {
                currentView = 'dashboard';
                return renderApp();
            }

            const theme = getThemeObj(c.themeId || 'white');
            const showImage = c.showImage !== false;
            applyThemeBackground(document.body, theme.id, showImage);
            const darkBg = isDark(theme.color);
            const btnClass = darkBg ? 'bg-white/20 text-white hover:bg-white/30' : 'bg-black/10 text-gray-900 hover:bg-black/20';

            let baseGoal = c.goal - 100;
            let currentSpan = c.count - baseGoal;
            if (currentSpan < 0) currentSpan = 0;
            let progressPct = (currentSpan / 100) * 100;
            if (progressPct > 100) progressPct = 100;
            
            if (isCelebrating) {
                progressPct = 100;
            } else if (isDraining) {
                progressPct = 0;
            }
            
            const liquidTransition = isDraining ? '1.5s' : '0.15s';
            const stepVal = c.step || 1;

            let html = `
                <div class="fixed inset-0 flex flex-col items-center justify-center cursor-pointer touch-none" 
                     onclick="handleTap(event)" 
                     ontouchstart="handleTouchStart(event)" 
                     ontouchend="handleTouchEnd(event)">
                    
                    <div class="absolute top-6 left-6 z-20 flex items-center gap-4">
                        <button onclick="goBack(event)" class="${btnClass} p-3 rounded-full backdrop-blur-md transition-colors shadow-sm">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7"></path></svg>
                        </button>
                        <span class="font-nunito font-bold text-4xl sm:text-5xl tracking-tight px-3 py-1" style="color: ${darkBg ? 'white' : '#111827'}; text-shadow: 0 4px 12px rgba(0,0,0,0.15);">${c.name || 'Counter'}</span>
                    </div>
                    
                    <div class="absolute top-6 right-6 z-20 flex items-center gap-3">
                        <div class="${btnClass} px-5 py-2.5 rounded-full font-extrabold backdrop-blur-md shadow-sm text-lg pointer-events-none">
                            Goal: ${c.goal}
                        </div>
                        <button onclick="openSettings(event)" class="${btnClass} p-3 rounded-full backdrop-blur-md transition-colors shadow-sm">
                            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </button>
                    </div>

                    <div class="flex flex-col items-center z-10 w-full relative">
                        <div id="ring-container" class="liquid-container mb-6" style="--ring-color: ${c.color}">
                            <div class="liquid-fill" style="height: ${progressPct}%; transition: height ${liquidTransition} cubic-bezier(0.4, 0, 0.2, 1);"></div>
                            <div class="liquid-text ${c.count >= 1000 ? 'shrink' : ''}">${c.count}</div>
                        </div>
                        
                        <button onclick="handleMinus(event)" class="${btnClass} p-3 rounded-xl backdrop-blur-md shadow-md active:scale-95 transition-transform flex items-center justify-center absolute -bottom-24 sm:-bottom-32">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
                        </button>
                    </div>

                </div>

                <div id="settingsModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex-col items-center justify-end sm:justify-center p-4">
                    <div class="bg-white rounded-3xl p-6 sm:p-8 w-full max-w-md max-h-[85vh] overflow-y-auto shadow-2xl transform transition-transform" onclick="event.stopPropagation()">
                        <div class="flex justify-between items-center mb-6">
                            <h2 class="text-2xl font-black text-gray-900">Settings</h2>
                            <button onclick="closeSettings(event)" class="bg-gray-100 text-gray-600 hover:bg-gray-200 p-2 rounded-full transition-colors">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                        
                        <div class="space-y-6">
                            <div>
                                <label class="block text-sm font-bold text-gray-500 uppercase tracking-wide mb-3">Ring & Liquid Color</label>
                                <div class="grid grid-cols-10 gap-2" id="ringColorGrid"></div>
                            </div>

                            <div>
                                <label class="block text-sm font-bold text-gray-500 uppercase tracking-wide mb-3">Background Theme</label>
                                <div class="grid grid-cols-5 gap-3" id="bgColorGrid"></div>
                                
                                <div class="mt-4 flex items-center justify-between bg-gray-50 p-4 rounded-xl border border-gray-200 cursor-pointer" onclick="toggleTempImage()">
                                    <span class="font-bold text-gray-700">Show Theme Images</span>
                                    <div class="w-12 h-6 rounded-full transition-colors relative" id="imageToggleBtn">
                                        <div class="absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform" id="imageToggleKnob"></div>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="pt-2">
                                <button onclick="saveSettings()" class="w-full bg-gray-900 text-white rounded-2xl py-4 font-black text-lg shadow-lg active:scale-95 transition-transform">Save Changes</button>
                            </div>
                            
                            <div class="mt-8 pt-8 border-t-4 border-gray-100 space-y-6">
                                <div class="text-center text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Adult Controls</div>
                                
                                <div class="w-full">
                                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Counter Name</label>
                                    <input type="text" id="editName" value="${c.name || 'My Counter'}" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-lg font-bold text-gray-900 focus:ring-4 focus:ring-blue-100 outline-none">
                                </div>

                                <div class="flex gap-4">
                                    <div class="w-1/3">
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Count</label>
                                        <input type="number" id="editCount" value="${c.count}" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-lg font-bold text-gray-900 focus:ring-4 focus:ring-blue-100 outline-none">
                                    </div>
                                    <div class="w-1/3">
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Goal</label>
                                        <input type="number" id="editGoal" value="${c.goal}" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-lg font-bold text-gray-900 focus:ring-4 focus:ring-blue-100 outline-none">
                                    </div>
                                    <div class="w-1/3">
                                        <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Step</label>
                                        <input type="number" id="editStep" value="${stepVal}" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-lg font-bold text-gray-900 focus:ring-4 focus:ring-blue-100 outline-none">
                                    </div>
                                </div>
                                
                                <div class="pt-4 border-t-2 border-gray-100 mt-4">
                                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Cloud Sync Code</label>
                                    <p class="text-xs text-gray-400 mb-2 leading-tight">Enter a secret word on all your devices to link them together! (e.g. Apples123)</p>
                                    <input type="text" id="editSyncCode" value="${syncCode}" placeholder="Secret Code" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-lg font-bold text-gray-900 focus:ring-4 focus:ring-blue-100 outline-none">
                                </div>
                                
                                <div class="pt-2 space-y-3 mt-4">
                                    <button onclick="deleteCurrentCounter()" class="w-full bg-red-50 text-red-600 rounded-2xl py-3 font-bold active:scale-95 transition-transform">Delete Counter</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('app').innerHTML = html;

            if (openSettingsImmediately) {
                openSettings();
                openSettingsImmediately = false;
            }
        }

        window.handleTouchStart = function(e) {
            if (e.target.closest('button') || e.target.closest('input')) return;
            touchStartY = e.changedTouches[0].screenY;
            isSwiping = false;
        }

        window.handleTouchEnd = function(e) {
            if (e.target.closest('button') || e.target.closest('input')) return;
            if (isCelebrating) return;
            const endY = e.changedTouches[0].screenY;
            
            if (endY - touchStartY > 40) {
                isSwiping = true;
                decreaseCount();
            }
        }

        window.handleMinus = function(e) {
            if (e) e.stopPropagation();
            decreaseCount();
        }

        function decreaseCount() {
            const c = counters.find(x => x.id === currentView);
            if (!c) return;
            
            c.count -= (c.step || 1);
            if (c.count < 0) c.count = 0;
            
            playPopSound(true);
            triggerRingAnim();
            saveData();
            renderFullScreenCounter();
        }

        function triggerRingAnim() {
            const ring = document.getElementById('ring-container');
            if (ring) {
                ring.classList.remove('pulse-anim');
                void ring.offsetWidth;
                ring.classList.add('pulse-anim');
            }
        }

        window.handleTap = function(e) {
            if (isSwiping) {
                isSwiping = false; 
                return;
            }
            if (isCelebrating) return;
            
            if (e.target.closest('button') || e.target.closest('input')) return;
            
            const c = counters.find(x => x.id === currentView);
            if (!c) return;

            c.count += (c.step || 1);
            playPopSound(false);

            triggerRingAnim();

            if (c.count >= c.goal) {
                isCelebrating = true;
                playCelebrateSound();
                
                c.goal = c.goal + 100;
                
                confetti({
                    particleCount: 1600,
                    spread: 180,
                    startVelocity: 60,
                    origin: { y: 0.4 },
                    colors: [c.color, '#ffffff', '#000000', '#facc15', '#f472b6', '#38bdf8']
                });
                
                setTimeout(() => {
                    confetti({
                        particleCount: 800,
                        spread: 140,
                        origin: { y: 0.5 },
                        colors: [c.color, '#ffffff', '#facc15']
                    });
                }, 300);

                document.body.classList.add('celebration-active');

                saveData();
                renderFullScreenCounter();

                setTimeout(() => {
                    document.body.classList.remove('celebration-active');
                    isCelebrating = false;
                    isDraining = true;
                    
                    saveData();
                    renderFullScreenCounter();

                    setTimeout(() => {
                        isDraining = false;
                        renderFullScreenCounter();
                    }, 1500); 

                }, 3000);
                
                return;
            }

            saveData();
            renderFullScreenCounter();
        }

        window.goBack = function(e) {
            if(e) e.stopPropagation();
            currentView = 'dashboard';
            renderApp();
        }

        window.openSettings = function(e) {
            if(e) e.stopPropagation();
            const c = counters.find(x => x.id === currentView);
            tempColor = c.color;
            tempBgColor = c.themeId || 'white';
            tempShowImage = c.showImage !== false;
            
            const modal = document.getElementById('settingsModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            renderSettingsColors();
        }

        window.closeSettings = function(e) {
            if(e) e.stopPropagation();
            const modal = document.getElementById('settingsModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        window.toggleTempImage = function() {
            tempShowImage = !tempShowImage;
            renderSettingsColors();
        }

        window.tempSetColor = function(color) {
            tempColor = color;
            renderSettingsColors();
        }

        window.tempSetBgColor = function(themeId) {
            tempBgColor = themeId;
            renderSettingsColors();
        }

        function renderSettingsColors() {
            const toggleBtn = document.getElementById('imageToggleBtn');
            const toggleKnob = document.getElementById('imageToggleKnob');
            if (toggleBtn && toggleKnob) {
                if (tempShowImage) {
                    toggleBtn.classList.add('bg-blue-500');
                    toggleBtn.classList.remove('bg-gray-300');
                    toggleKnob.classList.add('translate-x-6');
                } else {
                    toggleBtn.classList.add('bg-gray-300');
                    toggleBtn.classList.remove('bg-blue-500');
                    toggleKnob.classList.remove('translate-x-6');
                }
            }

            let ringHtml = ringColors.map(color => `
                <button onclick="tempSetColor('${color}')" 
                        class="aspect-square rounded-full flex items-center justify-center transition-transform ${tempColor === color ? 'scale-125 ring-2 ring-offset-2 ring-gray-400 z-10 shadow-md' : 'hover:scale-110'}"
                        style="background-color: ${color};"></button>
            `).join('');
            document.getElementById('ringColorGrid').innerHTML = ringHtml;

            let bgHtml = appThemes.map(theme => `
                <button onclick="tempSetBgColor('${theme.id}')" 
                        class="h-12 rounded-xl flex items-center justify-center text-2xl transition-transform border border-gray-200 ${tempBgColor === theme.id ? 'scale-105 ring-2 ring-offset-2 ring-gray-400 z-10 shadow-md' : 'hover:scale-95'}"
                        style="background-color: ${theme.color};" title="${theme.name}">
                        ${tempShowImage ? theme.icon : ''}
                </button>
            `).join('');
            document.getElementById('bgColorGrid').innerHTML = bgHtml;
        }

        window.saveSettings = function() {
            const c = counters.find(x => x.id === currentView);
            if (!c) return;

            const newName = document.getElementById('editName').value || 'My Counter';
            const newCount = parseInt(document.getElementById('editCount').value) || 0;
            const newGoal = parseInt(document.getElementById('editGoal').value) || 100;
            const newStep = parseInt(document.getElementById('editStep').value) || 1;
            const newSyncCode = (document.getElementById('editSyncCode').value || '').trim();

            c.name = newName;
            c.count = newCount;
            c.goal = newGoal;
            c.step = newStep;
            c.color = tempColor;
            c.themeId = tempBgColor;
            c.showImage = tempShowImage;

            if (newSyncCode !== syncCode) {
                syncCode = newSyncCode;
                localStorage.setItem('countingApp_syncCode', syncCode);
                if (db) {
                    setupRealtimeSubscription();
                }
            }

            saveData();
            window.closeSettings();
            renderApp();
        }

        window.deleteCurrentCounter = function() {
            const idToDelete = currentView;
            currentView = 'dashboard';
            window.closeSettings();
            
            counters = counters.filter(x => x.id !== idToDelete);
            saveData();
            renderApp();
            
            if (db) {
                const activeId = syncCode.trim() || 'default_local_user';
                deleteDoc(doc(db, 'artifacts', appId, 'users', activeId, 'counters', idToDelete)).catch(console.error);
            }
        }

        window.onload = renderApp;

    </script>
</body>
</html>
