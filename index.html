<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Counting App</title>
    
    <!-- iOS PWA Configurations -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192/BAE1FF/ffffff?text=Count">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Nunito Font -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Nunito', sans-serif; 
            touch-action: manipulation; /* Prevent double-tap zoom */
            overflow: hidden;
        }

        /* Thick Border & Gentle Glow Bubble */
        .counter-ring {
            border-width: 48px;
            border-style: solid;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            position: relative;
            overflow: hidden;
            background: white;
            transition: border-color 0.3s;
        }
        .counter-ring::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            box-shadow: inset 0 0 25px rgba(255, 255, 255, 0.9);
            pointer-events: none;
            z-index: 10;
        }

        /* Liquid Fill Animation */
        .liquid-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background-size: cover;
            background-position: center bottom;
            transition: height 0.5s ease-out;
            z-index: 1;
        }
        .liquid-fill.draining {
            height: 0% !important;
            transition: height 3s ease-in-out;
        }
        
        /* Smooth Background Celebration (2 cycles over 3s) */
        @keyframes slideBackground {
            0% { background-position: center 0px; }
            100% { background-position: center 240px; }
        }
        .celebrating .liquid-fill {
            animation: slideBackground 3s linear forwards;
        }

        /* Text Layering */
        .liquid-text {
            position: relative;
            z-index: 20;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            transition: font-size 0.3s ease;
        }
        .liquid-text.shrink {
            font-size: 0.75em;
        }

        /* Dashboard Thick Circles */
        .dash-circle {
            border-width: 12px;
            border-style: solid;
        }
    </style>
</head>
<body class="bg-gray-50 h-screen w-screen select-none">

    <!-- MAIN DASHBOARD -->
    <div id="dashboardView" class="h-full w-full flex flex-col p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-8 pt-8">
            <h1 class="text-3xl font-bold text-gray-800">My Counters</h1>
            <div class="flex gap-2 items-center">
                <label class="text-sm text-gray-500 font-bold">Sort:</label>
                <select id="sortSelect" class="p-2 bg-white border-2 border-gray-200 rounded-xl text-gray-700 font-bold focus:outline-none" onchange="renderDashboard()">
                    <option value="recent">Recently Used</option>
                    <option value="num-desc">Count (High-Low)</option>
                    <option value="num-asc">Count (Low-High)</option>
                    <option value="alpha-asc">A-Z</option>
                    <option value="alpha-desc">Z-A</option>
                </select>
            </div>
        </div>
        
        <div id="counterList" class="flex flex-wrap gap-8 justify-center items-start">
            <!-- Dynamically populated circles -->
        </div>

        <button onclick="createNewCounter()" class="mt-12 mx-auto bg-gray-200 hover:bg-gray-300 text-gray-600 font-bold rounded-full w-20 h-20 flex items-center justify-center text-4xl shadow-md transition-transform active:scale-95">+</button>
    </div>

    <!-- ACTIVE COUNTER VIEW -->
    <div id="counterView" class="hidden h-full w-full flex-col relative bg-gray-50">
        <!-- Top Bar -->
        <div class="absolute top-0 left-0 right-0 p-6 flex justify-between z-50">
            <button onclick="goToDashboard()" class="w-12 h-12 bg-white rounded-full shadow-md flex items-center justify-center text-xl font-bold text-gray-600 active:scale-90">←</button>
            <h2 id="activeTitle" class="text-2xl font-bold text-gray-700 self-center"></h2>
            <button onclick="openSettings()" class="w-12 h-12 bg-white rounded-full shadow-md flex items-center justify-center text-xl font-bold text-gray-600 active:scale-90">⚙️</button>
        </div>

        <!-- Giant Counter Bubble -->
        <div class="flex-1 flex items-center justify-center w-full mt-10">
            <div id="touchArea" class="w-80 h-80 sm:w-96 sm:h-96 md:w-[500px] md:h-[500px] rounded-full counter-ring flex items-center justify-center cursor-pointer relative" onclick="increaseCount()">
                <div id="liquidLayer" class="liquid-fill"></div>
                <span id="countDisplay" class="liquid-text text-7xl sm:text-8xl md:text-9xl font-bold text-white tracking-wider">0</span>
            </div>
        </div>

        <!-- Shrunk Minus Button -->
        <div class="absolute bottom-8 left-0 right-0 flex justify-center z-40">
            <button onclick="decreaseCount()" class="w-14 h-14 bg-white border-4 border-gray-200 rounded-full shadow-lg flex items-center justify-center text-2xl font-bold text-gray-400 active:scale-90 transition-transform">-</button>
        </div>
    </div>

    <!-- SETTINGS MODAL (No background click exit) -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-black/50 z-[100] flex items-end sm:items-center justify-center">
        <div class="bg-white w-full sm:w-96 max-h-[90vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl p-6 relative">
            <button onclick="closeSettings()" class="absolute top-4 right-4 w-8 h-8 bg-gray-100 rounded-full text-gray-500 font-bold">X</button>
            
            <h3 class="text-2xl font-bold mb-6 text-gray-800">Settings</h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-600 font-bold mb-1">Name</label>
                    <input type="text" id="editName" class="w-full p-3 bg-gray-50 border-2 border-gray-200 rounded-xl font-bold">
                </div>
                
                <div>
                    <label class="block text-gray-600 font-bold mb-1">Ring Color (Pastels)</label>
                    <div class="flex flex-wrap gap-2" id="colorPicker"></div>
                </div>

                <div class="pt-6 border-t-2 border-gray-100">
                    <p class="text-xs text-gray-400 uppercase font-bold tracking-widest mb-4">Adult Controls</p>
                    
                    <div class="flex gap-4 mb-4">
                        <div class="flex-1">
                            <label class="block text-gray-600 font-bold mb-1">Step</label>
                            <input type="number" id="editStep" class="w-full p-3 bg-gray-50 border-2 border-gray-200 rounded-xl font-bold">
                        </div>
                        <div class="flex-1">
                            <label class="block text-gray-600 font-bold mb-1">Current Goal</label>
                            <input type="number" id="editGoal" class="w-full p-3 bg-gray-50 border-2 border-gray-200 rounded-xl font-bold">
                        </div>
                    </div>

                    <div class="mb-6">
                        <label class="block text-gray-600 font-bold mb-1">Cloud Sync Code</label>
                        <input type="text" id="editSync" placeholder="e.g. Apples123" class="w-full p-3 bg-gray-50 border-2 border-gray-200 rounded-xl font-bold">
                        <p class="text-xs text-gray-400 mt-1">Type the same code on all devices to link them.</p>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-3 mt-8">
                <button onclick="saveSettings()" class="w-full py-4 bg-green-400 hover:bg-green-500 text-white font-bold rounded-xl text-lg shadow-sm">Save Changes</button>
                <button onclick="deleteCounter()" class="w-full py-4 bg-red-100 hover:bg-red-200 text-red-500 font-bold rounded-xl text-lg">Delete Counter</button>
            </div>
        </div>
    </div>

    <!-- AUDIO API CONTEXT -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playDeepPop() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
        function playChime() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(800, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1.5);
        }
    </script>

    <!-- FIREBASE REALTIME SYNC MODULE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAJvGT0O1DWBm_XjLtOuZC3TWiv6WKKVG4",
            authDomain: "speechcounter-cda.firebaseapp.com",
            projectId: "speechcounter-cda",
            storageBucket: "speechcounter-cda.firebasestorage.app",
            messagingSenderId: "987346473519",
            appId: "1:987346473519:web:04ea86e93d659ca4a86cda",
            measurementId: "G-4P6Z6VXVJF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let activeListener = null;

        window.pushToCloud = async (syncCode, appData) => {
            if (!syncCode) return;
            try {
                const docRef = doc(db, "shared_counters", syncCode);
                await setDoc(docRef, { counters: appData, lastUpdated: Date.now() }, { merge: true });
            } catch (error) {
                console.error("Cloud save failed.", error);
            }
        };

        window.startListeningToCloud = (syncCode, onDataReceived) => {
            if (!syncCode) return;
            if (activeListener) activeListener(); 
            
            const docRef = doc(db, "shared_counters", syncCode);
            activeListener = onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    onDataReceived(snapshot.data().counters);
                }
            });
        };
    </script>

    <!-- MAIN APP LOGIC -->
    <script>
        // Data & State
        let counters = JSON.parse(localStorage.getItem('counters')) || {};
        let activeCounterId = null;
        let mySyncCode = localStorage.getItem('syncCode') || "";
        let isCelebrating = false;

        const pastelColors = [
            '#FFB3BA', '#FFDFBA', '#FFFFBA', '#BAFFC9', '#BAE1FF', 
            '#E2CBF7', '#F3B0E8', '#FFC8DD', '#B9FBC0', '#FBF8CC',
            '#FDE4CF', '#FFCFD2', '#F1C0E8', '#CFBAF0', '#A3C4F3',
            '#90DBF4', '#8EECF5', '#98F5E1', '#B9FBC0', '#E5F993'
        ];
        
        const defaultBg = 'linear-gradient(to top, var(--tw-gradient-stops))';
        let currentTempColor = '';

        // Initialize App & Sync
        function initApp() {
            setTimeout(() => {
                if (mySyncCode && window.startListeningToCloud) {
                    window.startListeningToCloud(mySyncCode, (cloudCounters) => {
                        counters = cloudCounters;
                        localStorage.setItem("counters", JSON.stringify(counters));
                        if (activeCounterId === null) {
                            renderDashboard();
                        } else {
                            renderActiveCounter();
                        }
                    });
                }
            }, 500);

            if (Object.keys(counters).length === 0) createNewCounter();
            renderDashboard();
        }

        function saveAndPush() {
            localStorage.setItem('counters', JSON.stringify(counters));
            if (mySyncCode && window.pushToCloud) {
                window.pushToCloud(mySyncCode, counters);
            }
        }

        // Dashboard Logic
        function renderDashboard() {
            const list = document.getElementById('counterList');
            const sortMethod = document.getElementById('sortSelect').value;
            list.innerHTML = '';
            
            let arr = Object.entries(counters).map(([id, data]) => ({ id, ...data }));
            
            arr.sort((a, b) => {
                if (sortMethod === 'recent') return (b.lastAccessed || 0) - (a.lastAccessed || 0);
                if (sortMethod === 'num-desc') return b.count - a.count;
                if (sortMethod === 'num-asc') return a.count - b.count;
                if (sortMethod === 'alpha-asc') return a.name.localeCompare(b.name);
                if (sortMethod === 'alpha-desc') return b.name.localeCompare(a.name);
                return 0;
            });

            arr.forEach(c => {
                const hexColor = c.color || pastelColors[0];
                // Convert hex to rgb for 25% opacity background
                let r = parseInt(hexColor.slice(1,3), 16), g = parseInt(hexColor.slice(3,5), 16), b = parseInt(hexColor.slice(5,7), 16);
                const bgRgba = `rgba(${r},${g},${b},0.25)`;

                const btn = document.createElement('div');
                btn.className = "flex flex-col items-center gap-3 cursor-pointer group active:scale-95 transition-transform";
                btn.onclick = () => openCounter(c.id);
                
                btn.innerHTML = `
                    <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full dash-circle flex items-center justify-center shadow-md relative" 
                         style="border-color: ${hexColor}; background-color: ${bgRgba};">
                        <span class="text-2xl font-bold text-gray-700">${c.count}</span>
                    </div>
                    <span class="font-bold text-gray-600 text-lg w-24 sm:w-28 text-center truncate">${c.name}</span>
                `;
                list.appendChild(btn);
            });
        }

        function createNewCounter() {
            const id = Date.now().toString();
            counters[id] = {
                name: "New Goal",
                count: 0,
                goal: 100,
                _nextTarget: 100,
                step: 1,
                color: pastelColors[Math.floor(Math.random() * pastelColors.length)],
                lastAccessed: Date.now()
            };
            saveAndPush();
            renderDashboard();
        }

        function openCounter(id) {
            activeCounterId = id;
            counters[id].lastAccessed = Date.now();
            saveAndPush();
            
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('counterView').classList.remove('hidden');
            document.getElementById('counterView').classList.add('flex');
            
            renderActiveCounter();
        }

        function goToDashboard() {
            activeCounterId = null;
            document.getElementById('counterView').classList.add('hidden');
            document.getElementById('counterView').classList.remove('flex');
            document.getElementById('dashboardView').classList.remove('hidden');
            renderDashboard();
        }

        // Active Counter Logic
        function renderActiveCounter() {
            if (!activeCounterId) return;
            const c = counters[activeCounterId];
            
            // Initialization checks
            if(c._nextTarget === undefined) c._nextTarget = c.goal;
            if(c.count === undefined) c.count = 0;

            document.getElementById('activeTitle').innerText = c.name;
            
            const ring = document.getElementById('touchArea');
            ring.style.borderColor = c.color;
            
            const liq = document.getElementById('liquidLayer');
            liq.style.backgroundColor = c.color;
            
            const display = document.getElementById('countDisplay');
            display.innerText = c.count;
            
            // Shrink for 4+ digits
            if (c.count >= 1000) display.classList.add('shrink');
            else display.classList.remove('shrink');

            // Calculate fill percentage based on progress toward current target (+100 increment chunks)
            const previousMilestone = c._nextTarget - c.goal; // Baseline
            let fillPct = ((c.count - previousMilestone) / c.goal) * 100;
            if (fillPct > 100) fillPct = 100;
            if (fillPct < 0) fillPct = 0;
            
            if (!isCelebrating) {
                liq.style.height = `${fillPct}%`;
            }
        }

        function increaseCount() {
            if (isCelebrating) return;
            
            const c = counters[activeCounterId];
            c.count += c.step;
            playDeepPop();
            
            if (c.count >= c._nextTarget) {
                triggerCelebration(c);
            } else {
                saveAndPush();
                renderActiveCounter();
            }
        }

        function decreaseCount() {
            if (isCelebrating) return;
            const c = counters[activeCounterId];
            if (c.count >= c.step) c.count -= c.step;
            else c.count = 0;
            saveAndPush();
            renderActiveCounter();
        }

        // Infinite Milestone Celebration
        function triggerCelebration(c) {
            isCelebrating = true;
            playChime();
            
            const ring = document.getElementById('touchArea');
            const liq = document.getElementById('liquidLayer');
            
            // Trigger Confetti
            confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } });
            setTimeout(() => confetti({ particleCount: 100, spread: 100, origin: { y: 0.6 } }), 500);
            
            // Background Move Animation
            ring.classList.add('celebrating');
            liq.style.height = '100%'; // Ensure full before drain
            
            // Seamless reset and infinite goal push
            setTimeout(() => {
                ring.classList.remove('celebrating');
                
                // Drain animation
                liq.classList.add('draining');
                
                setTimeout(() => {
                    liq.classList.remove('draining');
                    
                    // Increment infinite target
                    c._nextTarget += c.goal; 
                    isCelebrating = false;
                    
                    saveAndPush();
                    renderActiveCounter();
                }, 3000); // Wait for drain to hit 0%
                
            }, 3000); // Background animation duration
        }

        // Touch gestures for minus
        let startY = 0;
        document.getElementById('touchArea').addEventListener('touchstart', e => startY = e.touches[0].clientY);
        document.getElementById('touchArea').addEventListener('touchend', e => {
            const endY = e.changedTouches[0].clientY;
            if (endY - startY > 50) decreaseCount(); // Swipe down to minus
        });

        // Settings Logic
        function openSettings() {
            if (!activeCounterId) return;
            const c = counters[activeCounterId];
            
            document.getElementById('editName').value = c.name;
            document.getElementById('editStep').value = c.step;
            document.getElementById('editGoal').value = c.goal;
            document.getElementById('editSync').value = mySyncCode;
            currentTempColor = c.color;

            const colorDiv = document.getElementById('colorPicker');
            colorDiv.innerHTML = '';
            pastelColors.forEach(color => {
                const btn = document.createElement('button');
                btn.className = `w-10 h-10 rounded-full border-4 ${currentTempColor === color ? 'border-gray-500 scale-110' : 'border-transparent'}`;
                btn.style.backgroundColor = color;
                btn.onclick = () => {
                    currentTempColor = color;
                    openSettings(); // Refresh selection outline
                };
                colorDiv.appendChild(btn);
            });

            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveSettings() {
            const c = counters[activeCounterId];
            c.name = document.getElementById('editName').value || "Counter";
            c.step = parseInt(document.getElementById('editStep').value) || 1;
            
            const newGoal = parseInt(document.getElementById('editGoal').value) || 100;
            
            // If goal changed, explicitly reset the tracking to prevent infinite trigger bugs
            if (c.goal !== newGoal) {
                c.goal = newGoal;
                c._nextTarget = (Math.floor(c.count / c.goal) * c.goal) + c.goal;
            }
            
            c.color = currentTempColor;
            
            const newSync = document.getElementById('editSync').value.trim();
            if (newSync !== mySyncCode) {
                mySyncCode = newSync;
                localStorage.setItem('syncCode', mySyncCode);
                // Hard reload to connect to new cloud listener cleanly
                window.location.reload(); 
            } else {
                saveAndPush();
                renderActiveCounter();
                closeSettings();
            }
        }

        function deleteCounter() {
            if (confirm("Are you sure you want to delete this counter?")) {
                delete counters[activeCounterId];
                saveAndPush();
                closeSettings();
                goToDashboard();
            }
        }

        // Boot
        window.onload = initApp;
    </script>
</body>
</html>
